x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: datafinance-airflow:2.9.2
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__SECRET_KEY: datafinance-local-dev-secret
    PYTHONPATH: /opt/airflow
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./scripts:/opt/airflow/scripts
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_db_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow \
          --firstname Admin \
          --lastname DataFinance \
          --role Admin \
          --email admin@datafinance.local \
          --password airflow || true
        python - <<'PY'
        import json, os, subprocess
        subprocess.run(["airflow", "connections", "delete", "snowflake_default"], check=False)
        extra = json.dumps({
            "account": os.environ["SNOWFLAKE_ACCOUNT"],
            "warehouse": os.getenv("SNOWFLAKE_WAREHOUSE", "WH_DATAFINANCE"),
            "database": os.getenv("SNOWFLAKE_DATABASE", "DATAFINANCE"),
            "role": os.getenv("SNOWFLAKE_ROLE", "ROL_DATAFINANCE"),
        })
        subprocess.run([
            "airflow", "connections", "add", "snowflake_default",
            "--conn-type", "snowflake",
            "--conn-login", os.environ["SNOWFLAKE_USER"],
            "--conn-password", os.environ["SNOWFLAKE_PASSWORD"],
            "--conn-schema", "SILVER",
            "--conn-extra", extra,
        ], check=True)
        print("Conexión snowflake_default configurada correctamente.")
        PY
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_db_volume:
